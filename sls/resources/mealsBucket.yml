Resources:
  MealsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: nacal-api-${sls:stage}-meals-bucket
      CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - '*'
              AllowedMethods:
                - 'POST'
              AllowedOrigins:
                - ${env:APP_WEB_URL}
