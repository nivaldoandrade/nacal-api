Resources:
  ReconcilePaymentsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      ActionsEnabled: !If
        - IsProd
        - true
        - false
      AlarmName: ${self:service}-${sls:stage}-ReconcilePaymentsErrorsAlarm
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReconcilePaymentsLambdaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref DQLAlarmTopic
