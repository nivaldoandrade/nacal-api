Resources:
  MealsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-MealsQueue
      # Must stay above the processMeal timeout (120s) and Meal.PROCESSING_LEASE_SECONDS (130s).
      VisibilityTimeout: 180
      ReceiveMessageWaitTimeSeconds: 20
      RedriveAllowPolicy:
        redrivePermission: denyAll
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MealsDLQ.Arn
        # Must stay above Meal.MAX_ATTEMPTS (2).
        maxReceiveCount: 3

  MealsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ${self:service}-${sls:stage}-MealsDLQ
      MessageRetentionPeriod: 1209600 # 14days

  MealsDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      ActionsEnabled: !If
        - IsProd
        - true
        - false
      AlarmName: ${self:service}-${sls:stage}-MealsDLQAlarm
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt MealsDLQ.QueueName
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanThreshold
      Threshold: 0
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref DQLAlarmTopic

  MealsQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      ActionsEnabled: !If
        - IsProd
        - true
        - false
      AlarmName: ${self:service}-${sls:stage}-MealsQueueAgeAlarm
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt MealsQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      ComparisonOperator: GreaterThanThreshold
      Threshold: 120
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref DQLAlarmTopic
