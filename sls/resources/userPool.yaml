Resources:
    UserPool:
      Type : AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:custom.cognito.UserPoolName}
        MfaConfiguration: OFF
        DeletionProtection: INACTIVE
        AutoVerifiedAttributes:
          - email
        UsernameAttributes:
          - email
        # Keep the current email until the new one is verified, so a user cannot point their
        # account at someone else's address through UpdateUserAttributes.
        UserAttributeUpdateSettings:
          AttributesRequireVerificationBeforeUpdate:
            - email
        AdminCreateUserConfig:
          AllowAdminCreateUserOnly: false
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: false
            RequireNumbers: false
            RequireSymbols: false
            RequireUppercase: false
        EmailConfiguration:
          EmailSendingAccount: DEVELOPER
          From: ${env:COGNITO_EMAIL}
          ReplyToEmailAddress: ${env:COGNITO_EMAIL_TO_REPLY}
          SourceArn: ${env:SES_SOURCE_ARN}
        Schema:
          - Name: internalId
            Mutable: false
            AttributeDataType: String
            Required: false
        LambdaConfig:
          PreTokenGenerationConfig:
            LambdaArn: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-preTokenGenerationTrigger'
            LambdaVersion: V2_0

    PreTokenGenerationLambdaPermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !GetAtt PreTokenGenerationTriggerLambdaFunction.Arn
        Principal: cognito-idp.amazonaws.com
        SourceArn: !GetAtt UserPool.Arn

    UserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      DependsOn: GoogleIdentityProvider
      Properties:
        ClientName: ${self:service}-${sls:stage}-UserPoolClient
        UserPoolId: !Ref UserPool
        GenerateSecret: true
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
        AccessTokenValidity: 1
        RefreshTokenValidity: 7
        TokenValidityUnits:
          AccessToken: days
          RefreshToken: days
        RefreshTokenRotation:
          Feature: ENABLED
          RetryGracePeriodSeconds: 0
        AllowedOAuthFlowsUserPoolClient: true
        AllowedOAuthScopes:
          - email
          - profile
          - openid
          - aws.cognito.signin.user.admin
        AllowedOAuthFlows:
          - code
        CallbackURLs:
          - http://localhost:8081
          - https://192.168.100.21:8443
          - exp://192.168.100.21:8081
        SupportedIdentityProviders:
          - COGNITO
          - Google
    UserPoolDomain:
      Type: AWS::Cognito::UserPoolDomain
      Properties:
        UserPoolId: !Ref UserPool
        Domain: nafoodiary
    GoogleIdentityProvider:
      Type: AWS::Cognito::UserPoolIdentityProvider
      Properties:
        UserPoolId: !Ref UserPool
        ProviderName: Google
        ProviderType: Google
        ProviderDetails:
          client_id: ${env:GOOGLE_CLIENT_ID}
          client_secret: ${env:GOOGLE_CLIENT_SECRET}
          authorize_scopes: "profile email openid"
        AttributeMapping:
          email: email
          email_verified: email_verified
          name: name
