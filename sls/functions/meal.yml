createMeal:
  handler: src/main/functions/meal/createMeal.handler
  events:
    - httpApi:
        path: /create-meal
        method: post
        authorizer:
          name: CognitoAuthorizer
listMeal:
  handler: src/main/functions/meal/listMeal.handler
  events:
    - httpApi:
        path: /meals
        method: get
        authorizer:
          name: CognitoAuthorizer
getMealById:
  handler: src/main/functions/meal/getMealById.handler
  events:
    - httpApi:
        path: /meals/{id}
        method: get
        authorizer:
          name: CognitoAuthorizer
createTextMeal:
  handler: src/main/functions/meal/createTextMeal.handler
  memorySize: 256
  timeout: 29
  events:
    - httpApi:
        path: /meals/text
        method: post
        authorizer:
          name: CognitoAuthorizer
addMealItems:
  handler: src/main/functions/meal/addMealItems.handler
  memorySize: 256
  timeout: 29
  events:
    - httpApi:
        path: /meals/{id}/items
        method: post
        authorizer:
          name: CognitoAuthorizer
deleteMeal:
  handler: src/main/functions/meal/deleteMeal.handler
  events:
    - httpApi:
        path: /meals/{id}
        method: delete
        authorizer:
          name: CognitoAuthorizer
removeMealItem:
  handler: src/main/functions/meal/removeMealItem.handler
  events:
    - httpApi:
        path: /meals/{id}/items/{itemId}
        method: delete
        authorizer:
          name: CognitoAuthorizer
restoreMealItem:
  handler: src/main/functions/meal/restoreMealItem.handler
  events:
    - httpApi:
        path: /meals/{id}/items/{itemId}/restore
        method: post
        authorizer:
          name: CognitoAuthorizer
processMeal:
  handler: src/main/functions/meal/processMeal.handler
  memorySize: 1024
  # Must stay below Meal.PROCESSING_LEASE_SECONDS (130s).
  timeout: 120
  events:
    - sqs:
        arn: !GetAtt MealsQueue.Arn
        batchSize: 2
checkMealUpload:
  handler: src/main/functions/meal/checkMealUpload.handler
  timeout: 15
  events:
    - sqs:
        arn: !GetAtt MealUploadCheckQueue.Arn
        batchSize: 10
newMealUploadedTrigger:
  handler: src/main/functions/meal/newMealUploadedTrigger.handler
  events:
    - s3:
        bucket: !Ref MealsBucket
        event: s3:ObjectCreated:*
        existing: true
        forceDeploy: true
