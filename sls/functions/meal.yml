createMeal:
  handler: src/main/functions/meal/createMeal.handler
  iam:
    role:
      statements:
        - ${self:custom.iam.mainTableRead}
        - ${self:custom.iam.mainTableWrite}
        - ${self:custom.iam.rateLimitTable}
        - ${self:custom.iam.mealsBucketPut}
        - ${self:custom.iam.mealUploadCheckQueueSend}
  events:
    - httpApi:
        path: /create-meal
        method: post
        authorizer:
          name: CognitoAuthorizer
listMeal:
  handler: src/main/functions/meal/listMeal.handler
  iam:
    role:
      statements:
        - ${self:custom.iam.mainTableRead}
  events:
    - httpApi:
        path: /meals
        method: get
        authorizer:
          name: CognitoAuthorizer
getMealById:
  handler: src/main/functions/meal/getMealById.handler
  iam:
    role:
      statements:
        - ${self:custom.iam.mainTableRead}
  events:
    - httpApi:
        path: /meals/{id}
        method: get
        authorizer:
          name: CognitoAuthorizer
createTextMeal:
  handler: src/main/functions/meal/createTextMeal.handler
  memorySize: 256
  timeout: 29
  environment:
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}
  iam:
    role:
      statements:
        - ${self:custom.iam.mainTableRead}
        - ${self:custom.iam.mainTableWrite}
        - ${self:custom.iam.rateLimitTable}
  events:
    - httpApi:
        path: /meals/text
        method: post
        authorizer:
          name: CognitoAuthorizer
addMealItems:
  handler: src/main/functions/meal/addMealItems.handler
  memorySize: 256
  timeout: 29
  environment:
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}
  iam:
    role:
      statements:
        - ${self:custom.iam.mainTableRead}
        - ${self:custom.iam.mainTableWrite}
        - ${self:custom.iam.rateLimitTable}
  events:
    - httpApi:
        path: /meals/{id}/items
        method: post
        authorizer:
          name: CognitoAuthorizer
deleteMeal:
  handler: src/main/functions/meal/deleteMeal.handler
  iam:
    role:
      statements:
        - ${self:custom.iam.mainTableRead}
        - ${self:custom.iam.mainTableWrite}
        - ${self:custom.iam.rateLimitTable}
        - ${self:custom.iam.mealsBucketDelete}
  events:
    - httpApi:
        path: /meals/{id}
        method: delete
        authorizer:
          name: CognitoAuthorizer
removeMealItem:
  handler: src/main/functions/meal/removeMealItem.handler
  iam:
    role:
      statements:
        - ${self:custom.iam.mainTableRead}
        - ${self:custom.iam.mainTableWrite}
        - ${self:custom.iam.rateLimitTable}
  events:
    - httpApi:
        path: /meals/{id}/items/{itemId}
        method: delete
        authorizer:
          name: CognitoAuthorizer
restoreMealItem:
  handler: src/main/functions/meal/restoreMealItem.handler
  iam:
    role:
      statements:
        - ${self:custom.iam.mainTableRead}
        - ${self:custom.iam.mainTableWrite}
        - ${self:custom.iam.rateLimitTable}
  events:
    - httpApi:
        path: /meals/{id}/items/{itemId}/restore
        method: post
        authorizer:
          name: CognitoAuthorizer
processMeal:
  handler: src/main/functions/meal/processMeal.handler
  memorySize: 1024
  # Must stay below Meal.PROCESSING_LEASE_SECONDS (130s).
  timeout: 120
  environment:
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}
    CLOUDFLARE_AI_API_TOKEN: ${env:CLOUDFLARE_AI_API_TOKEN, ''}
  iam:
    role:
      statements:
        - ${self:custom.iam.mainTableRead}
        - ${self:custom.iam.mainTableWrite}
        - ${self:custom.iam.rateLimitTable}
        - ${self:custom.iam.mealsBucketGet}
        - ${self:custom.iam.mealsBucketDelete}
  events:
    - sqs:
        arn: !GetAtt MealsQueue.Arn
        batchSize: 2
        functionResponseType: ReportBatchItemFailures
        maximumConcurrency: 5
checkMealUpload:
  handler: src/main/functions/meal/checkMealUpload.handler
  timeout: 15
  iam:
    role:
      statements:
        - ${self:custom.iam.mainTableRead}
        - ${self:custom.iam.mainTableWrite}
        - ${self:custom.iam.rateLimitTable}
        - ${self:custom.iam.mealsBucketDelete}
  events:
    - sqs:
        arn: !GetAtt MealUploadCheckQueue.Arn
        batchSize: 10
        functionResponseType: ReportBatchItemFailures
newMealUploadedTrigger:
  handler: src/main/functions/meal/newMealUploadedTrigger.handler
  iam:
    role:
      statements:
        - ${self:custom.iam.mainTableRead}
        - ${self:custom.iam.mainTableWrite}
        - ${self:custom.iam.mealsBucketGet}
        - ${self:custom.iam.mealsQueueSend}
  events:
    - s3:
        bucket: !Ref MealsBucket
        event: s3:ObjectCreated:*
        existing: true
        forceDeploy: true
