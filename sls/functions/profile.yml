updateProfile:
  handler: src/main/functions/profile/updateProfile.handler
  iam:
    role:
      statements:
        - ${self:custom.iam.mainTableRead}
        - ${self:custom.iam.mainTableWrite}
  events:
    - httpApi:
        path: /profiles
        method: put
        authorizer:
          name: CognitoAuthorizer
