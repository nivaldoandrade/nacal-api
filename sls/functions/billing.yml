plans:
  handler: src/main/functions/billing/getPlans.handler
  events:
    - httpApi:
        path: /billing/plans
        method: get
        authorizer:
          name: CognitoAuthorizer
trial:
  handler: src/main/functions/billing/startTrial.handler
  iam:
    role:
      statements:
        - ${self:custom.iam.mainTableRead}
        - ${self:custom.iam.mainTableWrite}
        - ${self:custom.iam.rateLimitTable}
  events:
    - httpApi:
        path: /billing/trial
        method: post
        authorizer:
          name: CognitoAuthorizer
checkout:
  handler: src/main/functions/billing/checkout.handler
  timeout: 29
  environment:
    ASAAS_API_KEY: ${env:ASAAS_API_KEY}
  iam:
    role:
      statements:
        - ${self:custom.iam.mainTableRead}
        - ${self:custom.iam.mainTableWrite}
        - ${self:custom.iam.rateLimitTable}
  events:
    - httpApi:
        path: /billing/checkout
        method: post
        authorizer:
          name: CognitoAuthorizer
cancel:
  handler: src/main/functions/billing/cancel.handler
  timeout: 15
  environment:
    ASAAS_API_KEY: ${env:ASAAS_API_KEY}
  iam:
    role:
      statements:
        - ${self:custom.iam.mainTableRead}
        - ${self:custom.iam.mainTableWrite}
        - ${self:custom.iam.rateLimitTable}
  events:
    - httpApi:
        path: /billing/cancel
        method: post
        authorizer:
          name: CognitoAuthorizer
webhookAsaas:
  handler: src/main/functions/billing/webhookAsaas.handler
  timeout: 15
  reservedConcurrency: 5
  environment:
    ASAAS_API_KEY: ${env:ASAAS_API_KEY}
    ASAAS_WEBHOOK_TOKEN: ${env:ASAAS_WEBHOOK_TOKEN}
  iam:
    role:
      statements:
        - ${self:custom.iam.mainTableRead}
        - ${self:custom.iam.mainTableWrite}
        - ${self:custom.iam.rateLimitTable}
        - ${self:custom.iam.alertTopicPublish}
  events:
    - httpApi:
        path: /billing/webhooks/asaas
        method: post
reconcilePayments:
  handler: src/main/functions/billing/reconcilePayments.handler
  timeout: 60
  maximumRetryAttempts: 0
  environment:
    ASAAS_API_KEY: ${env:ASAAS_API_KEY}
  iam:
    role:
      statements:
        - ${self:custom.iam.mainTableRead}
        - ${self:custom.iam.mainTableWrite}
        - ${self:custom.iam.rateLimitTable}
        - ${self:custom.iam.alertTopicPublish}
  events:
    - schedule:
        rate: rate(1 hour)
        enabled: ${file(./sls/config/reconcileScheduleEnabled.js):enabled}
