signUp:
  handler: src/main/functions/auth/signUp.handler
  events:
    - httpApi:
        path: /auth/sign-up
        method: POST

signIn:
  handler: src/main/functions/auth/signIn.handler
  events:
    - httpApi:
        path: /auth/sign-in
        method: POST

confirmSignUp:
  handler: src/main/functions/auth/confirmSignUp.handler
  events:
    - httpApi:
        path: /auth/confirm-sign-up
        method: POST

resendConfirmationCode:
  handler: src/main/functions/auth/resendConfirmationCode.handler
  events:
    - httpApi:
        path: /auth/resend-confirmation-code
        method: POST

refreshToken:
  handler: src/main/functions/auth/refreshToken.handler
  events:
    - httpApi:
        path: /auth/refresh-token
        method: POST

forgotPassword:
  handler: src/main/functions/auth/forgotPassword.handler
  events:
    - httpApi:
        path: /auth/forgot-password
        method: POST

confirmationForgotPassword:
  handler: src/main/functions/auth/confirmationForgotPassword.handler
  events:
    - httpApi:
        path: /auth/confirmation-forgot-password
        method: POST

oauthCallback:
  handler: src/main/functions/auth/oauthCallback.handler
  events:
    - httpApi:
        path: /auth/oauth/callback
        method: POST

completeOnboarding:
  handler: src/main/functions/auth/completeOnboarding.handler
  events:
    - httpApi:
        path: /auth/complete-onboarding
        method: POST

preSignUpTrigger:
  handler: src/main/functions/auth/preSignUpTrigger.handler
  events:
    - cognitoUserPool:
        pool: ${self:custom.cognito.UserPoolName}
        trigger: PreSignUp
        existing: true
        forceDeploy: true

preTokenGenerationTrigger:
  handler: src/main/functions/auth/preTokenGenerationTrigger.handler

customMessageTrigger:
  handler: src/main/functions/auth/customMessageTrigger.handler
  events:
    - cognitoUserPool:
        pool: ${self:custom.cognito.UserPoolName}
        trigger: CustomMessage
        existing: true
        forceDeploy: true
