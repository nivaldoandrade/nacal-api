me:
  handler: src/main/functions/account/me.handler
  memorySize: 512
  iam:
    role:
      statements:
        - ${self:custom.iam.mainTableRead}
        - ${self:custom.iam.mainTableWrite}
        - ${self:custom.iam.rateLimitTable}
        - ${self:custom.iam.cognitoAdminGetUser}
  events:
    - httpApi:
        path: /me
        method: get
        authorizer:
          name: CognitoAuthorizer
