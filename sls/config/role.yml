statements:
  - Effect: Allow
    Action:
      - dynamodb:PutItem
      - dynamodb:Query
      - dynamodb:GetItem
      - dynamodb:UpdateItem
      - dynamodb:DeleteItem
      - dynamodb:TransactWriteItems
    Resource:
      - !GetAtt MainTable.Arn
      - !Sub "${MainTable.Arn}/index/*"
  - Effect: Allow
    Action:
      - dynamodb:PutItem
      - dynamodb:GetItem
      - dynamodb:UpdateItem
      - dynamodb:TransactWriteItems
    Resource: !GetAtt RateLimitTable.Arn
  - Effect: Allow
    Action:
      - cognito-idp:AdminDeleteUser
      - cognito-idp:AdminGetUser
      - cognito-idp:AdminUpdateUserAttributes
      - cognito-idp:ListUsers
      - cognito-idp:AdminCreateUser
      - cognito-idp:AdminLinkProviderForUser
      - cognito-idp:AdminSetUserPassword
    Resource: !GetAtt UserPool.Arn
  - Effect: Allow
    Action:
      - s3:PutObject
      - s3:GetObject
      - s3:DeleteObject
    Resource:
      - !GetAtt MealsBucket.Arn
      - !Sub ${MealsBucket.Arn}/*
  - Effect: Allow
    Action:
      - sns:Publish
    Resource: !Ref DQLAlarmTopic
  - Effect: Allow
    Action:
      - sqs:SendMessage
    Resource:
      - !GetAtt MealsQueue.Arn
      - !GetAtt MealUploadCheckQueue.Arn

