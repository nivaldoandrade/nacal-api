COGNITO_CLIENT_ID: !Ref UserPoolClient
COGNITO_USER_POOL_ID: !Ref UserPool
MAIN_TABLE_NAME: !Ref MainTable
RATE_LIMIT_TABLE_NAME: !Ref RateLimitTable
MEALS_BUCKET_NAME: !Ref MealsBucket
MEALS_CDN_DOMAIN_NAME: !If
  - ShouldSetupMealsCDN
  - ${env:MEALS_CDN_DOMAIN_NAME, ''}
  - !GetAtt MealBucketCDN.DomainName
MEALS_QUEUE_URL: !Ref MealsQueue
MEAL_UPLOAD_CHECK_QUEUE_URL: !Ref MealUploadCheckQueue
COGNITO_POOL_DOMAIN: !Sub 'https://${UserPoolDomain}.auth.${self:provider.region}.amazoncognito.com'
ASAAS_BASE_URL: ${env:ASAAS_BASE_URL}
ASAAS_WEBHOOK_ALLOWED_IPS: ${env:ASAAS_WEBHOOK_ALLOWED_IPS, ''}
ALERT_TOPIC_ARN: !Ref DQLAlarmTopic
APP_WEB_URL: ${env:APP_WEB_URL}
CLOUDFLARE_ACCOUNT_ID: ${env:CLOUDFLARE_ACCOUNT_ID, ''}
MEAL_GATE_ENABLED: ${env:MEAL_GATE_ENABLED, 'true'}
MEAL_GATE_REJECT_THRESHOLD: ${env:MEAL_GATE_REJECT_THRESHOLD, '0.30'}
BETA_GATE_ENABLED: ${env:BETA_GATE_ENABLED, 'false'}
BETA_ALLOWED_EMAILS: ${env:BETA_ALLOWED_EMAILS, ''}

SERVICE_NAME: ${self:service}-${sls:stage}
