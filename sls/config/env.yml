APP_WEB_URL: ${env:APP_WEB_URL}
CLOUDFLARE_ACCOUNT_ID: ${env:CLOUDFLARE_ACCOUNT_ID, ''}
CLOUDFLARE_AI_API_TOKEN: ${env:CLOUDFLARE_AI_API_TOKEN, ''}
MEAL_GATE_ENABLED: ${env:MEAL_GATE_ENABLED, 'true'}
