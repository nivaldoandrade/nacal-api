# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: nivaldoandrade
# "service" is the name of this project. This will also be added to your AWS resource names.
service: api

custom:
  cognito:
    UserPoolName: ${self:service}-${sls:stage}-UserPool

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  memorySize: 128
  region: sa-east-1
  environment: ${file(./sls/config/env.yml)}
  iam:
    role: ${file(./sls/config/role.yml)}
  httpApi:
    cors: true
    disableDefaultEndpoint: ${env:APIGATEWAY_DEFAULT_ENDPOINT_DISABLE, false}
    authorizers:
      CognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !GetAtt UserPool.ProviderURL
        audience:
          - !Ref UserPoolClient
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  domain:
    enabled: ${file(./sls/config/domainEnabled.js):enabled}
    name: ${env:API_DOMAIN_NAME, ''}
    certificateArn: ${env:API_CERTIFICATE_ARN, ''}
    createRoute53Record: false
    apiType: http
    endpointType: regional

package:
  individually: true

build:
  esbuild:
    configFile: ./esbuild.config.mjs

resources:
  - ${file(./sls/resources/userPool.yaml)}
  - ${file(./sls/resources/mainTable.yml)}
  - ${file(./sls/resources/mealsBucket.yml)}
  - ${file(./sls/resources/mealsBucketCDN.yml)}
  - ${file(./sls/resources/MealsQueue.yml)}
  - ${file(./sls/resources/DLQAlarmTopic.yml)}
  - ${file(./sls/resources/rateLimitTable.yml)}

functions:
  - ${file(./sls/functions/hello.yaml)}
  - ${file(./sls/functions/auth.yaml)}
  - ${file(./sls/functions/account.yml)}
  - ${file(./sls/functions/meal.yml)}
  - ${file(./sls/functions/profile.yml)}
  - ${file(./sls/functions/goal.yml)}
  - ${file(./sls/functions/billing.yml)}
